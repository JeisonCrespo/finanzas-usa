name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17 para Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Activar Caché de Gradle para compilación rápida
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: Generar carpeta nativa Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Compilar archivo APK Release
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK con versión 1.0.4
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Finanzas-USA-v1.0.4.apk
          cp android/app/build/outputs/apk/release/app-release.apk Finanzas-USA.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-USA-v1.0.4-APK
          path: Finanzas-USA-v1.0.4.apk

      - name: Publicar APK v1.0.4 en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Finanzas USA Android APK (v1.0.4) — Correcciones y Mejoras Visuales"
          make_latest: true
          body: |
            ### 🚀 Finanzas USA v1.0.4 — Corrección de Errores y Bugs Visuales

            Esta actualización **1.0.4** se enfoca en resolver errores reportados, pulir la interfaz visual en modo claro/oscuro, integrar un calendario interactivo en toda la app y añadir control total sobre préstamos, cuotas y cuentas separadas:

            #### 🐛 1. Arreglo de Errores y Bugs Visuales
            - **Corrección en Tema Claro (Modo Blanco)**: Eliminados todos los fondos oscuros/negros residuales en la tarjeta de *Runway (Presupuesto)*, el *Radar de Gastos Hormiga (Resumen)*, botones de acceso rápido y modales de edición. Ahora todo el contenido mantiene un contraste suave y legible.
            - **Textos y Botones sin Desbordes**: Ajuste responsivo de tipografías y padding en botones de Presupuesto, Cuentas y Ajustes para evitar cortes en cualquier pantalla.
            - **Eliminación de duplicados**: Corregido el doble signo `+` en botones de categorías y creación.

            #### 📅 2. Nuevo Calendario Interactivo en Toda la App
            - **Adiós a escribir fechas manualmente**: Selector de fechas visual integrado con navegación de meses, días de la semana y botón de confirmación.
            - **Atajos rápidos**: Presets de un toque para *Hoy, Mañana, +7 días, +15 días* y *1° del próximo mes*.
            - **Disponible en todos los módulos**: Registro y edición de transacciones, vencimientos de recurrentes, primera cuota de deudas BNPL y compromisos de préstamos.

            #### 🤝 3. Préstamos: Edición y Cuentas Bancarias Asociadas
            - **Edición completa**: Modifica el monto, persona, dirección (*Me deben / Yo debo*), fecha de promesa y notas.
            - **Cuenta bancaria vinculada**: Ahora puedes especificar de qué cuenta salió el dinero prestado o en qué cuenta se recibió el dinero.
            - **Registro de abonos**: Al registrar un pago parcial o total, puedes indicar a qué cuenta entra o de cuál sale el abono.

            #### 💳 4. Cuotas y BNPL (Affirm, Klarna, Afterpay, Tarjetas)
            - **Edición de planes de cuotas**: Modifica cuotas restantes, total, pagos mínimos y APR.
            - **Frecuencia configurable**: Selecciona *Cada Mes (Mensual)*, *Cada 15 Días (Quincenal)* o *Semanal*.
            - **Proyección automática de cuotas**: La app calcula y proyecta automáticamente las fechas exactas y montos estimados en el calendario para todas las cuotas pendientes.
            - **Recordatorios locales en Android**: Notificaciones automáticas 1 o 2 días antes de cada vencimiento.

            #### 👁️ 5. Privacidad y Control de Cuentas Separadas (Dinero Ajeno)
            - **En Bancos**: Tus cuentas personales se muestran primero; las cuentas separadas de terceros se agrupan al fondo con un botón para colapsarlas y ocultarlas.
            - **En Resumen**: Botón de ojo interactivo tanto en el sub-balance de *Cuentas Separadas* como en la sección de *Dinero ajeno guardado*, permitiendo ocultar todos los montos con `••••••` y esconder los recuadros individuales.

            #### 🌓 6. Modo Blanco y Negro con Persistencia
            - Alterna entre tema oscuro y tema claro desde Ajustes con guardado automático en SQLite.
          files: |
            Finanzas-USA-v1.0.4.apk
            Finanzas-USA.apk
            android/app/build/outputs/apk/release/app-release.apk
