name: Compilar APK Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17 para Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Activar Caché de Gradle para compilación rápida
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: Generar carpeta nativa Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Compilar archivo APK Release
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK con versión 1.0.3
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Finanzas-USA-v1.0.3.apk
          cp android/app/build/outputs/apk/release/app-release.apk Finanzas-USA.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-USA-v1.0.3-APK
          path: Finanzas-USA-v1.0.3.apk

      - name: Publicar APK v1.0.3 en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Finanzas USA Android APK (v1.0.3)"
          body: "Versión **1.0.3** con ícono Wallet, bancos directos (Wells Fargo, Chase, Truist), importador inteligente de alertas/CSV, préstamos, metas de ahorro, respaldo en Google Drive y recordatorios de notificaciones en Android 1 o 2 días antes."
          files: |
            Finanzas-USA-v1.0.3.apk
            Finanzas-USA.apk
            android/app/build/outputs/apk/release/app-release.apk
